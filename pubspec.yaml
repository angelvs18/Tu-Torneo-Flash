name: tu_torneo_flash
description: "Tu Torneo Flash: organiza y sigue torneos deportivos locales."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.1.1
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4
  intl: any
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.7
  sign_in_with_apple: ^8.2.0
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.2 # 2.17+ requires build 5, not yet supported by riverpod_generator
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9

flutter:
  uses-material-design: true
  generate: true
